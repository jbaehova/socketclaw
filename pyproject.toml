[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "socketclaw"
version = "0.2.0"
description = "Local-first terminal security operations cockpit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "httpx>=0.28",
    "pydantic>=2.10",
    "sqlalchemy>=2.0",
    "textual>=2.0",
    "typer>=0.16",
]

[project.scripts]
socketclaw = "socketclaw.cli:app"

[dependency-groups]
dev = [
    "gradio>=5.0",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "pyright>=1.1.400",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-textual-snapshot>=1.0",
    "python-whois>=0.9",
    "ruff>=0.12",
    "scapy>=2.5",
    "websockets>=12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src/socketclaw", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
