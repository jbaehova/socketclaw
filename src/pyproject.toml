[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "socketclaw"
dynamic = ["version"]
description = "Local-first terminal security operations cockpit"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["network-monitoring", "security", "terminal", "textual"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "aiosqlite>=0.20",
    "click>=8.1",
    "httpx>=0.28",
    "pydantic>=2.10",
    "sqlalchemy[asyncio]>=2.0",
    "textual>=2.0",
    "typer>=0.16",
]

[project.urls]
Changelog = "https://github.com/jbaehova/SocketClaw/blob/main/src/CHANGELOG.md"
Issues = "https://github.com/jbaehova/SocketClaw/issues"
Repository = "https://github.com/jbaehova/SocketClaw"

[project.scripts]
socketclaw = "socketclaw.cli:app"

[tool.hatch.version]
path = "src/socketclaw/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/CHANGELOG.md",
    "/README.md",
    "/pyproject.toml",
    "/src/socketclaw",
]

[tool.hatch.build.targets.wheel]
packages = ["src/socketclaw"]

[dependency-groups]
dev = [
    "defusedxml>=0.7.1",
    "packaging>=24",
    "pyright>=1.1.400",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-textual-snapshot>=1.0",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--snapshot-dirname=snapshots"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src/socketclaw", "scripts"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
