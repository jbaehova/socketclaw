name: macOS standalone release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  build:
    needs: quality
    strategy:
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Check version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^__version__ = "\([^"]*\)"$/\1/p' src/src/socketclaw/__init__.py)
          test "$RELEASE_TAG" = "v$version"
      - name: Build executable
        run: |
          uv sync --project src --frozen --no-dev
          uv run --project src --frozen --no-dev --with pyinstaller==6.22.3 \
            pyinstaller --clean --onedir --collect-data socketclaw \
            --collect-submodules textual.widgets \
            --hidden-import aiosqlite \
            --hidden-import sqlalchemy.dialects.sqlite.aiosqlite \
            --name socketclaw src/scripts/frozen_main.py
          ./dist/socketclaw/socketclaw version
          SOCKETCLAW_HOME="$(mktemp -d)" ./dist/socketclaw/socketclaw doctor
          SOCKETCLAW_HOME="$(mktemp -d)" ./dist/socketclaw/socketclaw db migrate
          uv run --project src --locked --no-dev python src/scripts/pty_smoke.py --executable ./dist/socketclaw/socketclaw
          tar -czf "socketclaw-darwin-${{ matrix.architecture }}.tar.gz" -C dist socketclaw
      - uses: actions/upload-artifact@v4
        with:
          name: socketclaw-darwin-${{ matrix.architecture }}
          path: socketclaw-darwin-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: socketclaw-darwin-*
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum socketclaw-darwin-*.tar.gz > SHA256SUMS
          gh release create "$RELEASE_TAG" socketclaw-darwin-*.tar.gz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
